name: Build EX20v v2

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_COMMIT: 2d1c9d1b85b8e5204420c0dd71a8421ddfe1dfd4

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Get OpenWrt and apply patches
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout $OPENWRT_COMMIT
          git -c user.name=ci -c user.email=ci@localhost am ../patches/*.patch

      - name: Feeds
        run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          printf '%s\n' \
            CONFIG_TARGET_econet=y \
            CONFIG_TARGET_econet_en7528=y \
            CONFIG_TARGET_MULTI_PROFILE=y \
            CONFIG_TARGET_PER_DEVICE_ROOTFS=y \
            CONFIG_TARGET_DEVICE_econet_en7528_DEVICE_tplink_ex20v-v2=y \
            CONFIG_TARGET_DEVICE_econet_en7528_DEVICE_tplink_ex20v-v2-rescue=y \
            CONFIG_TARGET_ROOTFS_INITRAMFS=y > .config
          make defconfig

      - name: Build
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          make -j$(nproc) || make -j1 V=s

      - name: Collect images
        run: |
          mkdir out
          B=openwrt/bin/targets/econet/en7528
          cp $B/*tplink_ex20v-v2-rescue-initramfs-kernel.bin out/ex20v-rescue.bin
          cp $B/*tplink_ex20v-v2-squashfs-kernel.bin       out/ex20v-kernel.bin
          cp $B/*tplink_ex20v-v2-squashfs-ubi.bin          out/ex20v-ubi.bin
          cp $B/*tplink_ex20v-v2-squashfs-sysupgrade.bin   out/ex20v-v2-sysupgrade.bin
          cp scripts/* out/
          for f in out/ex20v-rescue.bin out/ex20v-kernel.bin; do
            s=$(stat -c%s $f); echo "$f $s"; [ $s -le 6291456 ] || { echo "TOO BIG: $f"; exit 1; }
          done
          (cd out && sha256sum * > sha256sums.txt)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ex20v-v2-images
          path: out/*

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
